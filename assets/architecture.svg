<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Architecture: Yan Agent calls server.cjs over MCP stdio; server.cjs calls the Rust worker over JSON-RPC; both resolve paths inside the workspace">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C121B"/>
      <stop offset="1" stop-color="#0A0F16"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2DD4BF"/>
    </marker>
  </defs>

  <rect width="1000" height="320" rx="16" fill="url(#abg)"/>
  <rect x="0.75" y="0.75" width="998.5" height="318.5" rx="15.25" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <text x="40" y="52" fill="#64748B" font-family="'Cascadia Code',Consolas,monospace" font-size="12" letter-spacing="2">REQUEST PATH</text>

  <!-- Yan Agent -->
  <g>
    <rect x="28" y="104" width="176" height="104" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <text x="116" y="146" text-anchor="middle" fill="#F1F5F9" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="18" font-weight="600">Yan Agent</text>
    <text x="116" y="174" text-anchor="middle" fill="#64748B" font-family="'Cascadia Code',Consolas,monospace" font-size="12">host runtime</text>
  </g>

  <!-- arrow 1 -->
  <line x1="208" y1="156" x2="252" y2="156" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="230" y="140" text-anchor="middle" fill="#7DD3FC" font-family="'Cascadia Code',Consolas,monospace" font-size="11">MCP</text>
  <text x="230" y="182" text-anchor="middle" fill="#475569" font-family="'Cascadia Code',Consolas,monospace" font-size="10">stdio</text>

  <!-- server.cjs -->
  <g>
    <rect x="256" y="104" width="240" height="104" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="376" y="144" text-anchor="middle" fill="#F1F5F9" font-family="'Cascadia Code',Consolas,monospace" font-size="16">server.cjs</text>
    <text x="376" y="170" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="12">协议适配 · 路径边界</text>
    <text x="376" y="190" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="12">输出预算 · 错误归一</text>
  </g>

  <!-- arrow 2 -->
  <line x1="500" y1="156" x2="544" y2="156" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="522" y="140" text-anchor="middle" fill="#7DD3FC" font-family="'Cascadia Code',Consolas,monospace" font-size="11">JSON-RPC</text>
  <text x="522" y="182" text-anchor="middle" fill="#475569" font-family="'Cascadia Code',Consolas,monospace" font-size="10">stdin</text>

  <!-- worker -->
  <g>
    <rect x="548" y="104" width="248" height="104" rx="12" fill="#0F172A" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="672" y="144" text-anchor="middle" fill="#F1F5F9" font-family="'Cascadia Code',Consolas,monospace" font-size="15">dsh-ops-worker.exe</text>
    <text x="672" y="170" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="12">Rust · 只读解析</text>
    <text x="672" y="190" text-anchor="middle" fill="#2DD4BF" font-family="'Cascadia Code',Consolas,monospace" font-size="11">0.4.4</text>
  </g>

  <!-- arrow 3 -->
  <line x1="800" y1="156" x2="844" y2="156" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="822" y="140" text-anchor="middle" fill="#7DD3FC" font-family="'Cascadia Code',Consolas,monospace" font-size="11">read</text>

  <!-- workspace -->
  <g>
    <rect x="848" y="104" width="124" height="104" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <text x="910" y="148" text-anchor="middle" fill="#F1F5F9" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="15">Workspace</text>
    <text x="910" y="172" text-anchor="middle" fill="#64748B" font-family="'Cascadia Code',Consolas,monospace" font-size="11">bounded</text>
  </g>

  <!-- boundary note -->
  <path d="M376 212 C376 268, 910 268, 910 212" fill="none" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow-teal)"/>
  <text x="640" y="286" text-anchor="middle" fill="#5EEAD4" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="12">先规范化到真实路径，再比较工作区边界</text>

  <text x="40" y="300" fill="#334155" font-family="'Cascadia Code',Consolas,monospace" font-size="10.5">no network · no writes · no open ports</text>
</svg>
